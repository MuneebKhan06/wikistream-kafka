name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: wikistream
  POSTGRES_USER: wikistream
  POSTGRES_PASSWORD: wikistream

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wikistream
          POSTGRES_USER: wikistream
          POSTGRES_PASSWORD: wikistream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wikistream -d wikistream"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Create schema
        run: psql "postgresql://wikistream:wikistream@localhost:5432/wikistream" -f db/schema.sql

      # The database integration tests run against the service above.
      # Tests that need Kafka skip themselves here and run in the e2e job.
      - name: Tests
        run: pytest -q

  e2e:
    name: End to end pipeline
    runs-on: ubuntu-latest
    needs: test
    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      # One broker here, three in the real cluster. Replication is not what
      # this job checks: it checks that data flows correctly end to end.
      KAFKA_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wikistream
          POSTGRES_USER: wikistream
          POSTGRES_PASSWORD: wikistream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wikistream -d wikistream"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: apache/kafka:3.8.0
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Wait for Kafka
        run: |
          python - <<'EOF'
          import sys, time
          from confluent_kafka.admin import AdminClient
          admin = AdminClient({"bootstrap.servers": "localhost:9092"})
          for attempt in range(60):
              try:
                  admin.list_topics(timeout=5)
                  print(f"kafka ready after {attempt} retries")
                  sys.exit(0)
              except Exception as exc:
                  print(f"waiting for kafka: {exc}")
                  time.sleep(2)
          sys.exit("kafka did not become ready")
          EOF

      - name: End to end test
        run: pytest -m e2e -q
